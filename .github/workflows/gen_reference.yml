name: Generate Reference

on:
    push:
        branches: [production]

permissions:
    contents: write

jobs:
    generate_reference:
        runs-on: ubuntu-latest
        container:
            image: docker.io/puppet/pdk:latest

        env:
            PDK_DISABLE_ANALYTICS: "true"
            BUNDLE_PATH: "./vendor"

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Gemfile Dependencies
              run: pdk bundle install

            - name: Cache dependencies
              uses: actions/cache@v3
              with:
                  path: |
                      vendor/
                      .bundle/
                  key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-gems-

            - name: Generate reference
              run: pdk bundle exec rake strings:generate:reference

            - name: Manually add safe directory
              run: git config --global --add safe.directory /__w/puppet-serts/puppet-serts

            - name: Commit and Push changes
              uses: EndBug/add-and-commit@v9
              with:
                  add: "REFERENCE.md"
                  message: "Update REFERENCE.md [skip ci]"
                  default_author: github_actions
